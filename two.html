    <script>
        const img = document.getElementById('ghostImg');
        
        // Define the proximity radius in pixels (starts fading at this distance)
        const proximityThreshold = 300; 

        document.addEventListener('mousemove', (e) => {
            // Get center coordinates of the image
            const rect = img.getBoundingClientRect();
            const imgX = rect.left + rect.width / 2;
            const imgY = rect.top + rect.height / 2;

            // Calculate distance between cursor and image center (Pythagorean theorem)
            const distance = Math.hypot(e.clientX - imgX, e.clientY - imgY);

            if (distance < proximityThreshold) {
                // Calculate opacity proportional to distance (closer = more transparent)
                let opacity = distance / proximityThreshold;
                
                // Keep a small buffer so it fully disappears slightly before touching
                if (opacity < 0.15) opacity = 0; 
                
                img.style.opacity = opacity;
            } else {
                img.style.opacity = 1;
            }
        });
    </script>
